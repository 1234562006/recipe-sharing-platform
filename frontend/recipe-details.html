<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Details – RecipeNest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container navbar-container">
      <a href="/index.html" class="brand-logo">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
            <line x1="6" y1="1" x2="6" y2="4"></line>
            <line x1="10" y1="1" x2="10" y2="4"></line>
            <line x1="14" y1="1" x2="14" y2="4"></line>
          </svg>
        </div>
        RecipeNest
      </a>

      <ul class="nav-links">
        <li><a href="/index.html" class="nav-link">Home</a></li>
        <li><a href="/recipes.html" class="nav-link">Explore Recipes</a></li>
        <li><a href="/about.html" class="nav-link">About</a></li>
        <li><a href="/contact.html" class="nav-link">Contact</a></li>
      </ul>

      <div class="nav-actions">
        <div id="nav-guest-actions" style="display: flex; gap: 0.5rem; align-items: center;">
          <a href="/login.html" class="btn btn-outline btn-sm">Log In</a>
          <a href="/register.html" class="btn btn-primary btn-sm">Join Free</a>
        </div>

        <div id="nav-user-actions" style="display: none; align-items: center; gap: 0.75rem;">
          <a href="/add-recipe.html" class="btn btn-primary btn-sm">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Add Recipe
          </a>

          <div class="nav-user-dropdown">
            <div id="user-pill-btn" class="user-pill">
              <div id="nav-user-avatar" class="user-avatar">U</div>
              <span id="nav-user-name">User</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
            <ul id="user-menu-dropdown" class="user-menu">
              <li class="user-menu-item"><a href="/profile.html">My Profile</a></li>
              <li class="user-menu-item"><a href="/my-recipes.html">My Recipes</a></li>
              <li class="user-menu-item"><a href="/favorites.html">Saved Favorites</a></li>
              <li class="user-menu-item" style="border-top: 1px solid var(--border-color); margin-top: 0.35rem;">
                <button id="logout-btn" style="color: var(--accent-red);">Log Out</button>
              </li>
            </ul>
          </div>
        </div>

        <button id="mobile-menu-toggle" class="mobile-menu-toggle" aria-label="Toggle navigation menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <main class="main-content container" style="margin-top: 2rem;">
    <!-- Breadcrumb -->
    <div style="margin-bottom: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
      <a href="/recipes.html" style="color: var(--primary); font-weight: 600;">&larr; Back to all recipes</a>
    </div>

    <!-- Detail Container -->
    <div id="recipe-detail-container">
      <!-- Loading Skeleton -->
      <div class="skeleton" style="height: 420px; border-radius: var(--radius-xl); margin-bottom: 2rem;"></div>
      <div class="skeleton" style="height: 100px; border-radius: var(--radius-md); margin-bottom: 2rem;"></div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <div>&copy; 2026 RecipeNest. College FSD Project.</div>
        <div>Built with Node.js, Express, MongoDB Atlas, and Vanilla JavaScript.</div>
      </div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script>
    const container = document.getElementById('recipe-detail-container');
    const urlParams = new URLSearchParams(window.location.search);
    const recipeId = urlParams.get('id');

    async function loadRecipe() {
      if (!recipeId) {
        ui.renderEmptyState(
          container,
          'Recipe Not Specified',
          'No recipe ID was provided in the address bar.',
          'Explore Recipes',
          '/recipes.html'
        );
        return;
      }

      try {
        const data = await api.get(`/recipes/${recipeId}`);
        const recipe = data.recipe;
        let isFavorited = data.isFavorited;
        const isAuthor = data.isAuthor;

        const totalTime = (recipe.prepTime || 0) + (recipe.cookTime || 0);
        const imageUrl = recipe.imageUrl || ui.PLACEHOLDER_IMAGE;
        const formattedDate = new Date(recipe.createdAt).toLocaleDateString('en-US', {
          month: 'long',
          day: 'numeric',
          year: 'numeric',
        });

        const diffClass =
          recipe.difficulty === 'Hard'
            ? 'diff-hard'
            : recipe.difficulty === 'Medium'
            ? 'diff-medium'
            : 'diff-easy';

        document.title = `${recipe.title} – RecipeNest`;

        container.innerHTML = `
          <!-- Hero Image & Title Overlay -->
          <div class="recipe-detail-hero">
            <img src="${ui.escapeHtml(imageUrl)}" alt="${ui.escapeHtml(recipe.title)}" onerror="ui.fallbackImage(this)">
            <div class="detail-overlay">
              <span class="card-category-badge" style="position: static; display: inline-block; margin-bottom: 0.75rem;">
                ${ui.escapeHtml(recipe.category)}
              </span>
              <h1 class="detail-title">${ui.escapeHtml(recipe.title)}</h1>
              <div class="detail-meta-strip">
                <span>By <strong>${ui.escapeHtml(recipe.author ? recipe.author.name : 'Community Chef')}</strong></span>
                <span>&bull;</span>
                <span>Published on ${formattedDate}</span>
              </div>
            </div>
          </div>

          <!-- Actions & Tag Row -->
          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem;">
            <div class="detail-badges-row" style="margin-bottom: 0;">
              <span class="difficulty-badge ${diffClass}" style="font-size: 0.85rem; padding: 0.35rem 0.85rem;">
                ${ui.escapeHtml(recipe.difficulty)} Difficulty
              </span>
              ${
                recipe.dietaryTags && recipe.dietaryTags.length > 0
                  ? recipe.dietaryTags
                      .map((tag) => `<span class="dietary-tag">${ui.escapeHtml(tag)}</span>`)
                      .join('')
                  : ''
              }
            </div>

            <div style="display: flex; gap: 0.75rem; align-items: center;">
              <!-- Favorite Button -->
              <button id="detail-fav-btn" class="btn ${isFavorited ? 'btn-danger' : 'btn-outline'}" style="gap: 0.4rem;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="${isFavorited ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
                  <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
                <span id="detail-fav-text">${isFavorited ? 'Favorited' : 'Favorite'}</span>
              </button>

              <!-- Share Button -->
              <button id="detail-share-btn" class="btn btn-outline" title="Copy recipe link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                  <polyline points="16 6 12 2 8 6"></polyline>
                  <line x1="12" y1="2" x2="12" y2="15"></line>
                </svg>
                Share
              </button>

              <!-- Author Exclusive Actions -->
              ${
                isAuthor
                  ? `
                <a href="/edit-recipe.html?id=${recipe._id}" class="btn btn-primary" style="gap: 0.4rem;">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                  </svg>
                  Edit
                </a>
                <button id="detail-delete-btn" class="btn btn-danger" style="gap: 0.4rem;">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                  </svg>
                  Delete
                </button>
                `
                  : ''
              }
            </div>
          </div>

          <!-- Description -->
          ${
            recipe.description
              ? `
            <div style="background: #fff; padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); margin-bottom: 2rem;">
              <p style="font-size: 1.05rem; color: var(--text-main); line-height: 1.7;">
                ${ui.escapeHtml(recipe.description)}
              </p>
            </div>
            `
              : ''
          }

          <!-- Stats Grid -->
          <div class="detail-stats-grid">
            <div class="stat-box">
              <span class="stat-label">Prep Time</span>
              <span class="stat-val">${recipe.prepTime || 0} min</span>
            </div>
            <div class="stat-box">
              <span class="stat-label">Cook Time</span>
              <span class="stat-val">${recipe.cookTime || 0} min</span>
            </div>
            <div class="stat-box">
              <span class="stat-label">Total Time</span>
              <span class="stat-val">${totalTime} min</span>
            </div>
            <div class="stat-box">
              <span class="stat-label">Servings</span>
              <span class="stat-val">${recipe.servings || 1} people</span>
            </div>
            <div class="stat-box">
              <span class="stat-label">Difficulty</span>
              <span class="stat-val" style="font-size: 1.05rem;">${recipe.difficulty}</span>
            </div>
          </div>

          <!-- Two Column Content: Ingredients & Instructions -->
          <div class="detail-two-col">
            <!-- Left: Ingredients Checklist -->
            <div class="ingredients-card">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h3 style="margin: 0; padding: 0; border: none;">Ingredients</h3>
                <span style="font-size: 0.8rem; color: var(--text-muted);">${recipe.ingredients.length} items</span>
              </div>
              <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">
                Check items off as you prepare your station:
              </p>
              <ul class="ingredient-list">
                ${recipe.ingredients
                  .map(
                    (ing, idx) => `
                  <li class="ingredient-item" onclick="this.classList.toggle('checked'); this.querySelector('input').checked = !this.querySelector('input').checked;">
                    <input type="checkbox" id="ing-${idx}" onclick="event.stopPropagation(); this.closest('li').classList.toggle('checked');">
                    <span>${ui.escapeHtml(ing)}</span>
                  </li>
                `
                  )
                  .join('')}
              </ul>
            </div>

            <!-- Right: Instructions -->
            <div class="instructions-card">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h3 style="margin: 0; padding: 0; border: none;">Step-by-Step Instructions</h3>
                <span style="font-size: 0.8rem; color: var(--text-muted);">${recipe.instructions.length} steps</span>
              </div>
              <ol class="steps-list">
                ${recipe.instructions
                  .map(
                    (step, idx) => `
                  <li class="step-item">
                    <div class="step-num">${idx + 1}</div>
                    <div class="step-text">${ui.escapeHtml(step)}</div>
                  </li>
                `
                  )
                  .join('')}
              </ol>
            </div>
          </div>
        `;

        // Bind Favorite button
        const favBtn = document.getElementById('detail-fav-btn');
        const favText = document.getElementById('detail-fav-text');
        favBtn.addEventListener('click', async () => {
          if (!auth.isLoggedIn()) {
            ui.showToast('Please log in to save recipes to your favorites.', 'info');
            setTimeout(() => {
              window.location.href = `/login.html?redirect=${encodeURIComponent(
                window.location.pathname + window.location.search
              )}`;
            }, 1000);
            return;
          }

          try {
            if (isFavorited) {
              await api.delete(`/favorites/${recipe._id}`);
              isFavorited = false;
              favBtn.className = 'btn btn-outline';
              favText.textContent = 'Favorite';
              favBtn.querySelector('svg').setAttribute('fill', 'none');
              ui.showToast('Removed from favorites', 'info');
            } else {
              await api.post(`/favorites/${recipe._id}`, {});
              isFavorited = true;
              favBtn.className = 'btn btn-danger';
              favText.textContent = 'Favorited';
              favBtn.querySelector('svg').setAttribute('fill', 'currentColor');
              ui.showToast('Saved to your favorites!', 'success');
            }
          } catch (err) {
            ui.showToast(err.message || 'Failed to update favorite', 'error');
          }
        });

        // Bind Share button
        document.getElementById('detail-share-btn').addEventListener('click', () => {
          if (navigator.clipboard) {
            navigator.clipboard.writeText(window.location.href);
            ui.showToast('Recipe URL copied to clipboard!', 'success');
          } else {
            ui.showToast('Link: ' + window.location.href, 'info');
          }
        });

        // Bind Delete button if author
        if (isAuthor) {
          document.getElementById('detail-delete-btn').addEventListener('click', () => {
            ui.showConfirm(
              'Delete Recipe',
              `Are you sure you want to permanently delete "${recipe.title}"?`,
              async () => {
                try {
                  await api.delete(`/recipes/${recipe._id}`);
                  ui.showToast('Recipe deleted successfully.', 'success');
                  setTimeout(() => {
                    window.location.href = '/my-recipes.html';
                  }, 800);
                } catch (err) {
                  ui.showToast(err.message || 'Error deleting recipe', 'error');
                }
              }
            );
          });
        }
      } catch (err) {
        ui.renderEmptyState(
          container,
          'Recipe Not Found',
          err.message || 'The requested recipe could not be loaded.',
          'Back to Recipes',
          '/recipes.html'
        );
      }
    }

    loadRecipe();
  </script>
</body>
</html>
