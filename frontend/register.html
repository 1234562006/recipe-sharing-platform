<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – RecipeNest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container navbar-container">
      <a href="/index.html" class="brand-logo">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
            <line x1="6" y1="1" x2="6" y2="4"></line>
            <line x1="10" y1="1" x2="10" y2="4"></line>
            <line x1="14" y1="1" x2="14" y2="4"></line>
          </svg>
        </div>
        RecipeNest
      </a>

      <ul class="nav-links">
        <li><a href="/index.html" class="nav-link">Home</a></li>
        <li><a href="/recipes.html" class="nav-link">Explore Recipes</a></li>
        <li><a href="/about.html" class="nav-link">About</a></li>
        <li><a href="/contact.html" class="nav-link">Contact</a></li>
      </ul>

      <div class="nav-actions">
        <a href="/login.html" class="btn btn-outline btn-sm">Log In</a>
      </div>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Join RecipeNest</h2>
        <p>Create your chef profile to bookmark and share recipes.</p>
      </div>

      <form id="register-form">
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="form-label" for="name">Full Name *</label>
          <input type="text" id="name" class="form-control" placeholder="e.g. Gordon Ramsay" required minlength="2">
        </div>

        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="form-label" for="email">Email Address *</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="form-label" for="password">Password (Minimum 6 characters) *</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required minlength="6" autocomplete="new-password">
        </div>

        <div class="form-group" style="margin-bottom: 1.75rem;">
          <label class="form-label" for="confirm-password">Confirm Password *</label>
          <input type="password" id="confirm-password" class="form-control" placeholder="••••••••" required minlength="6" autocomplete="new-password">
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; margin-bottom: 1.25rem;">
          Create Free Account
        </button>

        <p style="text-align: center; font-size: 0.9rem; color: var(--text-muted);">
          Already have an account? 
          <a href="/login.html" style="color: var(--primary); font-weight: 700;">Sign in here</a>
        </p>
      </form>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <div>&copy; 2026 RecipeNest. College FSD Project.</div>
      </div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script>
    auth.redirectIfAuthenticated();

    const form = document.getElementById('register-form');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (!name || !email || !password || !confirmPassword) {
        ui.showToast('Please fill out all fields.', 'error');
        return;
      }

      if (name.length < 2) {
        ui.showToast('Name must be at least 2 characters long.', 'error');
        return;
      }

      if (password.length < 6) {
        ui.showToast('Password must be at least 6 characters long.', 'error');
        return;
      }

      if (password !== confirmPassword) {
        ui.showToast('Passwords do not match. Please re-enter.', 'error');
        return;
      }

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating account...';

        const data = await api.post('/auth/register', { name, email, password });
        auth.setAuth(data.token, data.user);
        ui.showToast('Account created successfully! Welcome to RecipeNest.', 'success');

        setTimeout(() => {
          window.location.href = '/recipes.html';
        }, 1000);
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Free Account';
        ui.showToast(err.message || 'Registration failed. Try again.', 'error');
      }
    });
  </script>
</body>
</html>
